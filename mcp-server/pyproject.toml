[project]
name = "doris-mcp-agentcore"
version = "0.1.0"
description = "velodb-mcp-server @f235832 + AgentCore patches (see UPSTREAM.md)"
requires-python = ">=3.12"
# Pinned to upstream uv.lock @f235832 (+ mcp/starlette from the same lock, + boto3).
# The AgentCore CLI installs these with: uv pip install -r pyproject.toml --target <staging>
#   --python-version 3.12 --python-platform aarch64-manylinux* --only-binary :all:
dependencies = [
    "aiomysql==0.3.2",
    "authlib==1.7.2",
    "boto3==1.43.103",
    "cryptography==49.0.0",
    "fastmcp==3.4.4",
    "httpx==0.28.1",
    "importlib_metadata==9.0.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "mcp==1.28.1",
    "more-itertools==11.1.0",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "pymysql==1.2.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "sqlglot==30.13.0",
    "starlette==1.3.1",
    "tabulate==0.10.0",
    "tomli==2.4.1",
    "typer==0.27.0",
    "typing_extensions==4.16.0",
    "uvicorn==0.51.0",
    # Transitive (aiofile -> caio, fastmcp-slim -> platformdirs, boto3 -> botocore, cyclopts -> rich-rst,
    # mcp -> sse-starlette), pinned to the tested .venv: unpinned, the CodeZip resolved newer releases than
    # the ones the tests ran with (P3 T3.2; botocore 1.43.104, rich-rst 2.2.0 and sse-starlette 3.5.0 in P5).
    "botocore==1.43.103",
    "caio==0.12.5",
    "platformdirs==4.11.15",
    "rich-rst==2.1.0",
    "sse-starlette==3.4.11",
]
